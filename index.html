<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY.AI - Chatbot Pelajaran</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    #logo {
      width: 100px;
      margin: 10px auto;
    }

    #chatbox {
      width: 100%;
      max-width: 600px;
      background-color: #1e293b;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      min-height: 200px;
    }

    #pesanInput {
      width: 80%;
      padding: 10px;
      font-size: 16px;
      margin-top: 20px;
      border-radius: 5px;
      border: none;
    }

    #kirimBtn {
      padding: 10px 15px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 5px;
      border: none;
      background-color: #38bdf8;
      color: black;
      cursor: pointer;
    }

    .bot {
      text-align: left;
      margin-bottom: 10px;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>SKY.AI</h1>
  <img id="logo" src="Proyek Baru 251 [77F9643].png" alt="Logo SKY.AI">
  <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
  <button id="kirimBtn" onclick="kirim()">Kirim</button>

  <div id="chatbox"></div>

  <script>
    async function kirim() {
      const input = document.getElementById("pesanInput");
      const chatbox = document.getElementById("chatbox");
      const pesan = input.value;
      input.value = "";

      const p = document.createElement("p");
      p.textContent = "Kamu: " + pesan;
      chatbox.appendChild(p);

      const botMsg = document.createElement("p");
      botMsg.classList.add("typing");
      botMsg.textContent = "SKY.AI sedang mengetik...";
      chatbox.appendChild(botMsg);

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://fariz092.github.io/SKY.AI/",
            "X-Title": "SKY.AI"
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        botMsg.classList.remove("typing");

        if (data.choices && data.choices.length > 0) {
          botMsg.textContent = "SKY.AI: " + data.choices[0].message.content;
        } else {
          botMsg.textContent = "Maaf, terjadi kesalahan.";
        }
      } catch (err) {
        botMsg.classList.remove("typing");
        botMsg.textContent = "Maaf, gagal terhubung ke server.";
      }
    }
  </script>
</body>
</html>
