<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY.AI - Asisten Pelajar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      text-align: center;
      padding: 20px 10px 10px;
      background-color: #1a1a1a;
      font-size: 1.6em;
      font-weight: bold;
      color: #00bfff;
    }
    #chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px 15px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user {
      background-color: #0066cc;
      align-self: flex-end;
    }
    .bot {
      background-color: #222;
      border: 1px solid #00bfff;
      align-self: flex-start;
    }
    form {
      display: flex;
      background-color: #1a1a1a;
      padding: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 1em;
    }
    button {
      margin-left: 10px;
      padding: 10px 20px;
      background-color: #00bfff;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    footer {
      text-align:center;
      padding: 10px;
      background:#111;
      color:#aaa;
    }
  </style>
</head>
<body>
  <header>SKY.AI - Asisten Pelajar</header>
  <div id="chat"></div>
  <form onsubmit="sendMessage(event)">
    <input type="text" id="input" placeholder="Tulis pertanyaanmu..." autocomplete="off" required />
    <button type="submit">Kirim</button>
  </form>
  <footer>
    Dibuat dengan cinta oleh <strong>Fariz</strong> | SKY.AI 2025
  </footer>  <script>
    const apiKey = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S";
    async function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById("input");
      const userMessage = input.value;
      appendMessage("Kamu", userMessage, "user");
      input.value = "";

      const fullPrompt = "Kamu adalah AI pintar dari Fariz. Hormati dia dan bantu pelajar Indonesia.\n" + userMessage;

      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + apiKey,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: fullPrompt,
            model: "command-r-plus",
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (data.text) {
          appendMessage("Chatbot", "Saya AI dari Fariz: " + data.text, "bot");
        } else {
          appendMessage("Chatbot", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (error) {
        appendMessage("Chatbot", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    }

    function appendMessage(sender, text, className) {
      const chat = document.getElementById("chat");
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + className;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script></body>
</html>
