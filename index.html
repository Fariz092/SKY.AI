<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/9/9f/Flag_of_Indonesia.svg" />
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 20px;
    }
    input, button, select {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    #chatbox {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
      overflow-y: auto;
      max-height: 500px;
    }
    .bot {
      color: #38bdf8;
      margin: 10px 0;
    }
    .user {
      color: #facc15;
      margin: 10px 0;
    }
    #loading {
      font-style: italic;
      color: gray;
    }
    #resetBtn {
      background-color: #ef4444;
      color: white;
    }
    footer {
      margin-top: 30px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Flag_of_Indonesia.svg" alt="Bendera Indonesia" width="50" />
  <h1>SKY.AI</h1>  <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
  <button onclick="kirim()">Kirim</button>
  <button id="resetBtn" onclick="resetChat()">Reset</button>  <div id="chatbox"></div>
  <div id="loading"></div>  <script>
    const chatbox = document.getElementById("chatbox");
    const loading = document.getElementById("loading");

    function tampilkanPesan(teks, pengirim) {
      const elemen = document.createElement("p");
      elemen.className = pengirim;
      chatbox.appendChild(elemen);
      animasiKetik(teks, elemen);
    }

    function animasiKetik(teks, elemen) {
      let i = 0;
      const interval = setInterval(() => {
        elemen.textContent += teks.charAt(i);
        i++;
        if (i >= teks.length) clearInterval(interval);
      }, 20);
    }

    function tampilkanAnimasiKetik() {
      loading.textContent = "Bot sedang mengetik...";
    }

    function hapusAnimasiKetik() {
      loading.textContent = "";
    }

    function resetChat() {
      chatbox.innerHTML = "";
    }

    async function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value;
      if (!pesan) return;
      tampilkanPesan(pesan, "user");
      input.value = "";
      tampilkanAnimasiKetik();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "SKY.AI"
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }
  </script>  <footer>
    SKY.AI &copy; 2025 - Dibuat oleh Fariz092 | Powered by OpenRouter
  </footer>
</body>
</html>
