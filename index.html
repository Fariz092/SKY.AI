<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(to bottom, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: bold;
    }

    .flag {
      width: 32px;
      vertical-align: middle;
      margin-left: 10px;
    }

    #chat-container {
      background-color: #1e293b;
      border-radius: 16px;
      padding: 20px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
      overflow-y: auto;
      flex-grow: 1;
    }

    .message {
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .user {
      background-color: #2563eb;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background-color: #334155;
      align-self: flex-start;
      margin-right: auto;
    }

    #form {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    input {
      flex-grow: 1;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #0ea5e9;
    }

    .typing {
      font-style: italic;
      opacity: 0.7;
    }

    footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.6;
    }

    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .blinking-cursor::after {
      content: "|";
      animation: blink 1s infinite;
    }

  </style>
</head>
<body>
  <header>
    <h1>SKY.AI - Teman Belajar <img src="https://flagcdn.com/w40/id.png" class="flag" alt="ID Flag" /></h1>
  </header>

  <div id="chat-container"></div>

  <div id="form">
    <input type="text" id="pesanInput" placeholder="Tanyakan materi pelajaran..." />
    <button onclick="kirim()">Kirim</button>
  </div>

  <footer>
    Dibuat oleh Fariz092 | Terhubung ke OpenRouter | Karakter: teman santai
  </footer>

  <script>
    const chatContainer = document.getElementById("chat-container");
    const input = document.getElementById("pesanInput");

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") kirim();
    });

    function tampilkanPesan(teks, tipe) {
      const msg = document.createElement("div");
      msg.className = `message ${tipe}`;
      msg.innerText = teks;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function tampilkanAnimasiKetik() {
      const anim = document.createElement("div");
      anim.className = "message bot typing blinking-cursor";
      anim.innerText = "Sedang mengetik";
      anim.id = "typing";
      chatContainer.appendChild(anim);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hapusAnimasiKetik() {
      const anim = document.getElementById("typing");
      if (anim) chatContainer.removeChild(anim);
    }

    async function kirim() {
      const pesan = input.value.trim();
      if (!pesan) return;

      tampilkanPesan(pesan, "user");
      input.value = "";
      tampilkanAnimasiKetik();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "SKY.AI Chatbot"
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }
  </script>
</body>
</html>
