<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Chatbot Pelajaran</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #38bdf8;
    }

    #chat-container {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
      padding-right: 5px;
    }

    .message {
      margin: 10px 0;
    }

    .user {
      color: #0ea5e9;
      font-weight: bold;
    }

    .bot {
      color: #f1f5f9;
    }

    input[type="text"] {
      width: 75%;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px 15px;
      background-color: #38bdf8;
      border: none;
      border-radius: 5px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0ea5e9;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Chatbot Pelajaran</h1>
  <div id="chat-container">
    <div id="chat"></div>
    <input type="text" id="user-input" placeholder="Tanya sesuatu..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    const apiKey = "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";

    async function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      appendMessage("Kamu", message, "user");
      input.value = "";

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey,
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [{ role: "user", content: message }],
          }),
        });

        const data = await response.json();
        if (data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          appendMessage("Chatbot", reply, "bot");
        } else {
          appendMessage("Chatbot", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (error) {
        appendMessage("Chatbot", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    }

    function appendMessage(sender, text, className) {
      const chat = document.getElementById("chat");
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + className;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
