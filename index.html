<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    #chatbox {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      min-height: 200px;
    }
    #logo {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <img src="Proyek Baru 251 [77F9643].png" alt="Logo SKY.AI" id="logo" />
  <h1>SKY.AI - Chatbot Pelajaran</h1>
  <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
  <button onclick="kirim()">Kirim</button>
  <div id="chatbox"></div>  <script>
    async function kirimChat(pesan) {
      const chatbox = document.getElementById("chatbox");
      chatbox.innerHTML += `<p><i>Mengetik...</i></p>`;

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://fariz092.github.io",
            "X-Title": "SKY.AI"
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        chatbox.innerHTML = "";
        if (data.choices && data.choices.length > 0) {
          chatbox.innerHTML += `<p>${data.choices[0].message.content}</p>`;
        } else {
          chatbox.innerHTML += `<p>Maaf, terjadi kesalahan.</p>`;
        }
      } catch (err) {
        chatbox.innerHTML = "";
        chatbox.innerHTML += `<p>Gagal terhubung ke server. Coba lagi nanti.</p>`;
      }
    }

    function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value;
      if (pesan.trim() !== "") {
        kirimChat(pesan);
        input.value = "";
      }
    }
  </script></body>
</html>
