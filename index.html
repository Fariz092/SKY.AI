<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ascender+Sans:wght@700&display=swap">
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Ascender Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    header img {
      width: 100px;
      border-radius: 20px;
    }
    h1 {
      margin: 10px 0 5px;
    }
    #chat-container {
      width: 90%;
      max-width: 700px;
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }
    .pesan {
      margin: 10px 0;
      line-height: 1.5;
    }
    .user {
      color: #facc15;
    }
    .bot {
      color: #38bdf8;
    }
    #input-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    input {
      flex: 1;
      min-width: 60%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #38bdf8;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>
  <header>
    <img src="Proyek Baru 251 [77F9643].png" alt="Logo SKY.AI">
    <h1>SKY.AI</h1>
    <p>Teman belajar santai kamu!</p>
  </header>

  <div id="chat-container"></div>

  <div id="input-container">
    <input type="text" id="pesanInput" placeholder="Tanya sesuatu...">
    <button onclick="kirim()">Kirim</button>
  </div>

  <script>
    function tampilkanPesan(teks, tipe) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = "pesan " + tipe;
      div.innerText = teks;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    async function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value.trim();
      if (!pesan) return;
      
      tampilkanPesan("Kamu: " + pesan, "user");
      tampilkanPesan("SKY.AI sedang mikir...", "bot");
      input.value = "";

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://fariz092.github.io/SKY.AI/",
            "X-Title": "SKY.AI"
          },
          body: JSON.stringify({
            model: "mistralai/mistral-7b-instruct",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await res.json();
        document.querySelectorAll(".bot").forEach(e => e.remove());

        if (data.choices && data.choices.length > 0) {
          tampilkanPesan("SKY.AI: " + data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        document.querySelectorAll(".bot").forEach(e => e.remove());
        tampilkanPesan("Maaf, gagal terhubung ke server.", "bot");
      }
    }
  </script>
</body>
</html>
