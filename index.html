<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" />
  <style>
    body {
      margin: 0;
      font-family: 'Nunito', sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      padding: 20px;
    }
    header img {
      width: 100px;
      height: auto;
    }
    h1 {
      font-size: 1.5em;
      margin: 10px 0 0;
    }
    #chat {
      width: 90%;
      max-width: 600px;
      height: 70vh;
      overflow-y: auto;
      background-color: #222;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .message {
      margin: 10px 0;
      line-height: 1.5;
    }
    .bot {
      color: #00ffd5;
    }
    .user {
      color: #fff;
      text-align: right;
    }
    form {
      display: flex;
      width: 90%;
      max-width: 600px;
      margin-bottom: 30px;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1em;
      border: none;
      border-radius: 10px 0 0 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      background-color: #00ffd5;
      color: #000;
      border: none;
      border-radius: 0 10px 10px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo SKY.AI" />
    <h1>SKY.AI - Teman Belajar Kamu</h1>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Tanyakan apapun seputar pelajaran..." required />
    <button type="submit">Kirim</button>
  </form>

  <script>
    const apiKey = "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";
    const apiURL = "https://openrouter.ai/api/v1/chat/completions";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pesan = input.value.trim();
      if (!pesan) return;
      appendMessage("Kamu", pesan, "user");
      input.value = "";

      try {
        const response = await fetch(apiURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025."
              },
              {
                role: "user",
                content: pesan
              }
            ]
          })
        });

        const data = await response.json();
        if (data.choices && data.choices.length > 0) {
          appendMessage("SKY.AI", data.choices[0].message.content, "bot");
        } else {
          appendMessage("SKY.AI", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (error) {
        appendMessage("SKY.AI", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    });

    function appendMessage(sender, text, className) {
      const messageDiv = document.createElement("div");
      messageDiv.className = `message ${className}`;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
