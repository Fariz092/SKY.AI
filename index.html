<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKY.AI</title>
  <style>
    @font-face {
      font-family: 'Quantify';
      src: url('Quantify.ttf') format('truetype');
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sky-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: 'Quantify';
      font-size: 28px;
      animation: slowPulse 4s infinite;
    }

    @keyframes slowPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .flag {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: url('assets/indonesia-flag.svg') no-repeat center/cover;
      border: 2px solid white;
    }

    .welcome-text {
      font-family: 'Quantify';
      font-size: 26px;
      margin-bottom: 20px;
      text-align: center;
    }

    .chat-container {
      background: #111;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255,255,255,0.1);
      width: 90%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .input-bubble {
      background-color: #222;
      border: none;
      color: white;
      padding: 14px;
      font-size: 16px;
      border-radius: 14px;
      width: 100%;
    }

    .send-btn {
      align-self: flex-start;
      background-color: #333;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .send-btn:hover {
      background-color: #444;
    }

    .response-box {
      margin-top: 10px;
      background: #1a1a1a;
      padding: 12px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="sky-logo">SkyAI</div>
  <div class="flag"></div>
  <div class="welcome-text">Welcome to SKY.AI Buatan Anak Keren</div>

  <div class="chat-container">
    <input type="text" class="input-bubble" id="userInput" placeholder="Tulis pertanyaan di sini..." />
    <button class="send-btn" onclick="sendMessage()">Kirim</button>
    <div id="response" class="response-box"></div>
  </div>

  <script>
    const btn = document.querySelector('.send-btn');
    btn.addEventListener('click', () => {
      const audio = new Audio('https://www.myinstants.com/media/sounds/button-click.mp3');
      audio.play();
    });

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const responseBox = document.getElementById('response');
      const question = input.value.trim();
      if (!question) return;

      responseBox.textContent = 'Menunggu jawaban...';

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "mistralai/mistral-7b-instruct", 
            messages: [{ role: "user", content: question }]
          })
        });

        const data = await res.json();
        const aiReply = data.choices?.[0]?.message?.content || "Tidak ada jawaban.";
        responseBox.textContent = aiReply;

      } catch (err) {
        responseBox.textContent = "Terjadi kesalahan saat memproses.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
