<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajar</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 10px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    header img {
      height: 50px;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
    }
    .user {
      align-self: flex-end;
      background-color: #2a2a2a;
    }
    .bot {
      align-self: flex-start;
      background-color: #1e88e5;
    }
    form {
      width: 100%;
      display: flex;
      padding: 10px;
      box-sizing: border-box;
      background-color: #1e1e1e;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      background-color: #2a2a2a;
      color: white;
    }
    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background-color: #1e88e5;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #1565c0;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SKY.AI Logo" />
  </header>
  <main>
    <div id="chat"></div>
  </main>
  <form id="form">
    <input type="text" id="input" placeholder="Tanyakan apa saja..." required />
    <button type="submit">Kirim</button>
  </form>

  <script>
    const apiKey = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S";
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    function appendMessage(sender, text, className) {
      const msg = document.createElement("div");
      msg.className = `message ${className}`;
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      appendMessage("Kamu", question, "user");
      input.value = "";
      appendMessage("SKY.AI", "Mengetik...", "bot");

      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question,
            model: "command-r",
            chat_history: [],
          })
        });
        const data = await response.json();
        chat.lastChild.remove();
        if (data.text) {
          appendMessage("SKY.AI", data.text, "bot");
        } else {
          appendMessage("SKY.AI", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        chat.lastChild.remove();
        appendMessage("SKY.AI", "Gagal terhubung ke server.", "bot");
      }
    });
  </script>
</body>
</html>
