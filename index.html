<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LyukovAI - Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* CSS untuk tampilan dark mode dan desain modern */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
        }

        .header {
            padding: 20px;
            background-color: #1f1f1f;
            text-align: center;
            border-bottom: 2px solid #333;
        }

        .header h1 {
            margin: 0;
            font-size: 2rem;
            color: #00bcd4;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 2px solid #333;
        }

        .user-message, .ai-message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 80%;
        }

        .user-message {
            background-color: #00bcd4;
            color: #fff;
            align-self: flex-end;
        }

        .ai-message {
            background-color: #333;
            color: #fff;
            align-self: flex-start;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background-color: #1f1f1f;
            border-top: 2px solid #333;
        }

        .input-area input {
            width: 90%;
            padding: 10px;
            background-color: #333;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 1rem;
        }

        .input-area button {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 10px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .input-area button:hover {
            background-color: #0097a7;
        }

        .acknowledgment {
            font-size: 0.9em;
            color: #888;
            font-style: italic;
            margin-top: 20px;
        }

        /* Animasi mengetik */
        .typing {
            display: inline-block;
            position: relative;
            width: 60px;
        }

        .typing span {
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 6px;
            background-color: #00bcd4;
            border-radius: 50%;
            animation: typing 1.5s infinite ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.3s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes typing {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>LyukovAI - Chatbot</h1>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Tanya apa saja!" />
            <button onclick="sendMessage()">Kirim</button>
        </div>
        <div class="acknowledgment">AI ini dikembangkan oleh [Muhammad Fariz], menggunakan teknologi dari Cohere.</div>
    </div>

    <script>
        const API_KEY = 'HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S';  // Ganti dengan API key dari Cohere
        const chatBox = document.getElementById('chat-box');
        let typingElement;

        // Fungsi untuk menampilkan pesan di chat
        function displayMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add(isUser ? 'user-message' : 'ai-message');
            messageDiv.innerText = message;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // Scroll ke bawah setelah pesan ditambahkan
        }

        // Fungsi untuk menampilkan animasi mengetik
        function showTypingAnimation() {
            typingElement = document.createElement('div');
            typingElement.classList.add('typing');
            typingElement.innerHTML = `<span></span><span></span><span></span>`;
            chatBox.appendChild(typingElement);
        }

        // Fungsi untuk menghapus animasi mengetik
        function hideTypingAnimation() {
            if (typingElement) {
                typingElement.remove();
            }
        }

        // Fungsi untuk mengirim pesan dan mendapatkan respons dari AI
        async function sendMessage() {
            const userInput = document.getElementById('user-input').value.trim();
            if (userInput === '') return;

            // Tampilkan pesan pengguna
            displayMessage(userInput, true);

            // Tampilkan animasi mengetik AI
            showTypingAnimation();

            // Kirim permintaan ke API Cohere
            const response = await fetch('https://api.cohere.ai/v1/generate', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${API_KEY}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    model: 'command-xlarge-nightly', // Model Cohere yang digunakan
                    prompt: `Kamu adalah AI yang dibuat oleh [M.Fariz]. Jika ada pertanyaan tentang siapa yang membuatmu, jawab dengan informasi ini: "Aku dibuat oleh [Fariz], menggunakan teknologi dari Cohere."`,
                    max_tokens: 100,
                    temperature: 0.7,
                    stop_sequences: ["\n"]
                }),
            });

            const data = await response.json();
            const aiResponse = data.generations[0].text.trim();

            // Sembunyikan animasi mengetik
            hideTypingAnimation();

            // Tampilkan respons AI
            displayMessage(aiResponse);
        }
    </script>
</body>
  </html>
