<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKY.AI Chatbot</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    .title {
      font-size: 2em;
      margin-bottom: 20px;
      text-align: center;
    }
    .chat-box {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .input-box {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #00bcd4;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">SKY.AI - Chatbot Pelajaran</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-box">
      <input type="text" id="userInput" placeholder="Tanya pelajaran...">
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const userMessage = input.value.trim();
      if (!userMessage) return;

      chatBox.innerHTML += `<p><b>Kamu:</b> ${userMessage}</p>`;
      input.value = "";

      const res = await fetch("https://api.cohere.ai/v1/chat", {
        method: "POST",
        headers: {
          "Authorization": "Bearer HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: userMessage, chat_history: [] })
      });

      const data = await res.json();
      chatBox.innerHTML += `<p><b>Bot:</b> ${data.text || 'Maaf, tidak bisa menjawab.'}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
