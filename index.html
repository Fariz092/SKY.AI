<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #0f0f0f;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header img {
      width: 80px;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    #chat {
      width: 100%;
      max-width: 600px;
      height: 70vh;
      overflow-y: auto;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      background: #1c1c1c;
    }
    .message {
      margin: 10px 0;
      padding: 10px;
      border-radius: 5px;
    }
    .user {
      background-color: #2d2dff;
      align-self: flex-end;
    }
    .bot {
      background-color: #333;
      align-self: flex-start;
    }
    #form {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      width: 100%;
      max-width: 600px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      border-radius: 5px;
      border: none;
      background-color: #2d2dff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo SKY.AI">
    <h1>SKY.AI</h1>
    <p>Chatbot Pelajaran Kurikulum 2025 - Teman Belajarmu</p>
  </header>  <div id="chat"></div>  <form id="form">
    <input type="text" id="input" placeholder="Tanya apa aja tentang pelajaran..." required />
    <button type="submit">Kirim</button>
  </form>  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    const apiKey = "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";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pesan = input.value;
      input.value = "";
      appendMessage("Kamu", pesan, "user");
      appendMessage("SKY.AI", "Mengetik...", "bot", true);

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusKetik();

        if (data.choices && data.choices[0]) {
          appendMessage("SKY.AI", data.choices[0].message.content, "bot");
        } else {
          appendMessage("SKY.AI", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (error) {
        hapusKetik();
        appendMessage("SKY.AI", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    });

    function appendMessage(sender, text, className, isTyping = false) {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + className;
      messageDiv.innerHTML = `<strong>${sender}:</strong> <span>${text}</span>`;
      if (isTyping) messageDiv.id = "typing";
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function hapusKetik() {
      const typing = document.getElementById("typing");
      if (typing) typing.remove();
    }
  </script></body>
</html>
