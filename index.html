<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI</title>
  <link rel="icon" href="logo.png" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }header {
  display: flex;
  align-items: center;
  padding: 1rem;
  background-color: #1f1f1f;
  width: 100%;
  justify-content: center;
}

header img {
  height: 40px;
}

main {
  flex: 1;
  width: 100%;
  max-width: 600px;
  padding: 1rem;
  box-sizing: border-box;
  overflow-y: auto;
}

.message {
  margin: 1rem 0;
  padding: 1rem;
  border-radius: 12px;
  line-height: 1.5;
  max-width: 90%;
}

.message.user {
  background-color: #333;
  color: #fff;
  align-self: flex-end;
  text-align: right;
}

.message.bot {
  background-color: #1976d2;
  color: #fff;
  align-self: flex-start;
  text-align: left;
}

form {
  display: flex;
  width: 100%;
  max-width: 600px;
  padding: 1rem;
  background-color: #1f1f1f;
}

input[type="text"] {
  flex: 1;
  padding: 0.75rem;
  font-size: 1rem;
  border-radius: 8px;
  border: none;
  outline: none;
  background-color: #2c2c2c;
  color: #fff;
}

button {
  margin-left: 0.5rem;
  padding: 0.75rem 1.2rem;
  background-color: #1976d2;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SKY.AI" />
  </header>
  <main id="chat"></main>
  <form id="form">
    <input type="text" id="input" placeholder="Tanyakan sesuatu..." />
    <button type="submit">Kirim</button>
  </form>  <script>
    const apiKey = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S"; // Ganti dengan key Cohere kamu
    const apiURL = "https://api.cohere.ai/v1/chat";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    function appendMessage(sender, text, className) {
      const div = document.createElement("div");
      div.className = `message ${className}`;
      div.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pesan = input.value.trim();
      if (!pesan) return;

      appendMessage("Kamu", pesan, "user");
      input.value = "";

      try {
        const response = await fetch(apiURL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: "command-r",
            message: pesan,
          }),
        });

        const data = await response.json();
        if (data && data.text) {
          appendMessage("SKY.AI", data.text, "bot");
        } else {
          appendMessage("SKY.AI", "Maaf, saya tidak bisa menjawab.", "bot");
        }
      } catch (err) {
        appendMessage("SKY.AI", "Terjadi kesalahan.", "bot");
      }
    });
  </script></body>
</html>
