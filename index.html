<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    .logo-container {
      display: flex;
      justify-content: center;
      margin-top: 40px;
    }
    .logo {
      width: 120px;
      height: auto;
      border-radius: 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-top: 20px;
    }
    .chat-container {
      background: #333;
      margin: 30px auto;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      text-align: left;
      min-height: 200px;
    }
    #chatBox {
      white-space: pre-wrap;
    }
    .input-container {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    input[type="text"] {
      width: 70%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 10px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 15px;
      margin-left: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background-color: #1e90ff;
      color: white;
      cursor: pointer;
    }
    .typing {
      font-style: italic;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="SKY.AI Logo" class="logo" />
  </div>
  <h1>SKY.AI</h1>
  <p>Selamat Datang Di AI Kami. @Fariz092</p>  <div class="chat-container">
    <div id="chatBox">Ada Yang Bisa Saya Bantu?</div>
    <div id="typing" class="typing"></div>
  </div>  <div class="input-container">
    <input type="text" id="userInput" placeholder="Tulis pertanyaanmu di sini...">
    <button onclick="kirimPesan()">Kirim</button>
  </div>  <script>
    const API_KEY = "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"; // Masukkan API key kamu di sini

    async function kirimPesan() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const typing = document.getElementById("typing");
      const pesan = input.value.trim();
      if (!pesan) return;

      chatBox.innerHTML += `\n\nKamu: ${pesan}`;
      typing.innerText = "Sky.AI sedang mengetik...";
      input.value = "";

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b:free",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025."
              },
              {
                role: "user",
                content: pesan
              }
            ]
          })
        });

        const data = await response.json();
        typing.innerText = "";
        if (data.choices && data.choices.length > 0) {
          chatBox.innerHTML += `\n\nSky.AI: ${data.choices[0].message.content}`;
        } else {
          chatBox.innerHTML += "\n\nSky.AI: Maaf, terjadi kesalahan.";
        }
      } catch (err) {
        typing.innerText = "";
        chatBox.innerHTML += "\n\nSky.AI: Gagal terhubung ke server. Coba lagi nanti.";
      }
    }
  </script></body>
</html>
