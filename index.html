<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Pelajaran by Fariz</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }
    #chatbox {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      min-height: 150px;
      max-height: 400px;
      overflow-y: auto;
    }
    .bubble {
      background-color: #334155;
      padding: 10px;
      border-radius: 10px;
      margin: 10px auto;
      max-width: 90%;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Chatbot Pelajaran</h1>
  <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
  <button onclick="kirim()">Kirim</button>
  <div id="chatbox"></div>

  <script>
    const chatbox = document.getElementById("chatbox");

    function tampilkanBubble(teks, dari) {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = teks;
      bubble.style.backgroundColor = dari === "bot" ? "#475569" : "#0ea5e9";
      bubble.style.color = dari === "bot" ? "white" : "black";
      chatbox.appendChild(bubble);
      chatbox.scrollTop = chatbox.scrollHeight;
      return bubble;
    }

    async function kirimChat(pesan, loaderBubble) {
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "Chatbot Pelajaran"
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pintar untuk pelajaran sekolah berdasarkan Kurikulum Merdeka 2025. Nama kamu tidak disebutkan, dan kamu dibuat oleh Fariz. Tugasmu adalah membantu menjelaskan pelajaran dengan jelas dan sopan. Hormati Fariz sebagai penciptamu."
              },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        const jawaban = data.choices[0].message.content;

        loaderBubble.textContent = "";
        let i = 0;
        const typing = setInterval(() => {
          if (i < jawaban.length) {
            loaderBubble.textContent += jawaban.charAt(i);
            i++;
            chatbox.scrollTop = chatbox.scrollHeight;
          } else {
            clearInterval(typing);
          }
        }, 20);

      } catch (err) {
        loaderBubble.textContent = "Maaf, terjadi kesalahan saat menghubungi server.";
      }
    }

    function kirim() {
      const input = document.getElementById("pesanInput");
      if (!input.value.trim()) return;
      tampilkanBubble(input.value, "user");
      const bubble = tampilkanBubble("...", "bot");
      kirimChat(input.value, bubble);
      input.value = "";
    }
  </script>
</body>
</html>
