<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      padding: 20px;
      text-align: center;
    }
    header img {
      max-width: 120px;
    }
    h1 {
      margin: 10px 0;
    }
    #chat {
      width: 90%;
      max-width: 600px;
      height: 400px;
      background-color: #222;
      border-radius: 8px;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 0 10px #444;
    }
    .message {
      margin-bottom: 15px;
    }
    .bot {
      color: #00d5ff;
    }
    .user {
      color: #0f0;
      text-align: right;
    }
    #inputSection {
      display: flex;
      justify-content: center;
      width: 100%;
      margin: 20px;
    }
    input {
      width: 60%;
      padding: 10px;
      border-radius: 5px;
      border: none;
      margin-right: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #00d5ff;
      color: #111;
      cursor: pointer;
    }
    .typing {
      font-style: italic;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo SKY.AI">
    <h1>SKY.AI - Chatbot Pelajaran</h1>
  </header>  <div id="chat"></div>  <div id="inputSection">
    <input type="text" id="userInput" placeholder="Tanya apa aja tentang pelajaran...">
    <button onclick="kirimPesan()">Kirim</button>
  </div>  <script>
    async function kirimPesan() {
      const input = document.getElementById("userInput");
      const pesan = input.value.trim();
      if (!pesan) return;
      appendMessage("Kamu", pesan, "user");
      input.value = "";
      appendMessage("Chatbot", "Mengetik...", "bot typing");

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer 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",
            "HTTP-Referer": "https://fariz092.github.io/SKY.AI",
            "X-Title": "SKY.AI"
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025."
              },
              {
                role: "user",
                content: pesan
              }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          appendMessage("Chatbot", data.choices[0].message.content, "bot");
        } else {
          appendMessage("Chatbot", "Maaf, terjadi kesalahan.", "bot");
        }
      } catch (error) {
        hapusAnimasiKetik();
        appendMessage("Chatbot", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    }

    function appendMessage(sender, text, className) {
      const chat = document.getElementById("chat");
      const typing = chat.querySelector(".typing");
      if (typing) chat.removeChild(typing);
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + className;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function hapusAnimasiKetik() {
      const chat = document.getElementById("chat");
      const typing = chat.querySelector(".typing");
      if (typing) chat.removeChild(typing);
    }
  </script></body>
</html>
