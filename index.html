<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY AI</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      padding: 1rem;
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
    }
    header img {
      height: 40px;
      margin-right: 1rem;
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
    }
    #chat {
      flex-grow: 1;
      padding: 1rem;
      overflow-y: auto;
    }
    .message {
      margin: 0.5rem 0;
      padding: 0.75rem;
      border-radius: 10px;
      max-width: 80%;
    }
    .user {
      background-color: #238636;
      align-self: flex-end;
      color: white;
    }
    .bot {
      background-color: #21262d;
      align-self: flex-start;
    }
    #form {
      display: flex;
      padding: 1rem;
      background-color: #161b22;
      border-top: 1px solid #30363d;
    }
    #input {
      flex-grow: 1;
      padding: 0.5rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }
    #submit {
      margin-left: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #238636;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SKY AI Logo" />
    <h1>SKY AI</h1>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Tanyakan sesuatu..." autocomplete="off" required />
    <button type="submit" id="submit">Kirim</button>
  </form>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chat = document.getElementById('chat');form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  appendMessage('Kamu', text, 'user');
  input.value = '';
  try {
    const response = await fetch("https://api.cohere.ai/v1/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer ecVpVvRlg0lowsQNNGIBL5BuPi0kTkjjPe6G3eRs"
      },
      body: JSON.stringify({
        message: text,
        model: "command-r-plus",
        temperature: 0.7
      })
    });
    const data = await response.json();
    if (data.text) {
      appendMessage("SKY AI", data.text, "bot");
    } else {
      appendMessage("SKY AI", "Maaf, terjadi kesalahan.", "bot");
    }
  } catch (err) {
    appendMessage("SKY AI", "Maaf, gagal terhubung ke server.", "bot");
  }
});

function appendMessage(sender, text, className) {
  const msg = document.createElement('div');
  msg.className = `message ${className}`;
  msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

  </script>
</body>
</html>
