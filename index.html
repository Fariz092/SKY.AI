<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKY.AI - Chatbot AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@700&display=swap');

    body {
      background-color: #0f172a;
      color: white;
      font-family: 'Open Sans', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      background-color: #1e293b;
      width: 100%;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #334155;
    }

    header img {
      height: 30px;
      vertical-align: middle;
      margin-right: 10px;
    }

    h1 {
      display: inline;
      font-size: 24px;
    }

    #chat-container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }

    #chatbox {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 20px;
      min-height: 300px;
      overflow-y: auto;
    }

    .pesan {
      margin: 10px 0;
      text-align: left;
    }

    .bot {
      color: #38bdf8;
    }

    .user {
      color: #fbbf24;
    }

    #input-area {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #2563eb;
      border: none;
      padding: 12px 20px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    .typing {
      font-style: italic;
      color: gray;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Flag_of_Indonesia.svg" alt="ID Flag" />
    <h1>SKY.AI</h1>
  </header>

  <div id="chat-container">
    <div id="chatbox"></div>
    <div id="input-area">
      <input type="text" id="pesanInput" placeholder="Tulis pertanyaanmu di sini..." />
      <button onclick="kirim()">Kirim</button>
    </div>
  </div>

  <script>
    const API_KEY = "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";
    const chatbox = document.getElementById("chatbox");

    function tampilkanPesan(teks, dari) {
      const p = document.createElement("p");
      p.className = "pesan " + dari;
      p.textContent = teks;
      chatbox.appendChild(p);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function tampilkanAnimasiKetik() {
      const p = document.createElement("p");
      p.className = "pesan bot typing";
      p.id = "animasiKetik";
      p.textContent = "Sedang mengetik...";
      chatbox.appendChild(p);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function hapusAnimasiKetik() {
      const animasi = document.getElementById("animasiKetik");
      if (animasi) chatbox.removeChild(animasi);
    }

    async function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value.trim();
      if (!pesan) return;

      tampilkanPesan(pesan, "user");
      input.value = "";
      tampilkanAnimasiKetik();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + API_KEY,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "SKY.AI - Chatbot Pelajar"
          },
          body: JSON.stringify({
            model: "mistralai/mistral-7b-instruct",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }
  </script>
</body>
</html>
