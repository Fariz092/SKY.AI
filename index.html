<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Buatan Anak Keren</title>
  <link href="https://fonts.googleapis.com/css2?family=Quantify&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Quantify', sans-serif;
      background-color: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1.2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .logo {
      width: 120px;
      height: auto;
      margin-bottom: 10px;
      animation: bounceIn 1s ease;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.8); opacity: 0; }
      60% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(1); }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      text-align: center;
    }

    .flag {
      width: 40px;
      margin-top: 4px;
    }

    .chat-container {
      margin-top: 30px;
      background: #111;
      border-radius: 20px;
      padding: 25px;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1a1a1a;
      border-radius: 15px;
      padding: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
    }

    .input-area button {
      background: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <img src="https://raw.githubusercontent.com/Fariz092/SKY.AI/main/logo.png" alt="SKY.AI Logo" class="logo" />
  <h1>Welcome to SKY.AI Buatan Anak Keren</h1>
  <img src="https://flagcdn.com/w40/id.png" alt="Indonesia Flag" class="flag" />

  <div class="chat-container">
    <div class="input-area">
      <input type="text" placeholder="Tulis pertanyaan kamu di sini..." id="userInput" />
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <div id="responseArea"></div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const responseArea = document.getElementById("responseArea");
      const question = input.value.trim();
      if (!question) return;

      responseArea.innerHTML = "Sedang menjawab...";
      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer ecVpVvRlg0lowsQNNGIBL5BuPi0kTkjjPe6G3eRs"
          },
          body: JSON.stringify({
            model: "command-r",
            message: question
          })
        });
        const data = await response.json();
        responseArea.innerHTML = `<p>${data.text || "Gagal menjawab. Coba lagi."}</p>`;
      } catch (error) {
        responseArea.innerHTML = "<p>Terjadi kesalahan. Silakan coba lagi.</p>";
      }
    }
  </script>
</body>
</html>
