<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SKY.AI Chat</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #111;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .title {
      font-size: 20px;
      font-weight: bold;
    }

    header img {
      height: 30px;
    }

    #chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg.user {
      align-self: flex-end;
      background-color: #333;
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    .msg.bot {
      align-self: flex-start;
      background-color: #007bff;
      padding: 10px 15px;
      border-radius: 12px;
      max-width: 80%;
    }

    #input-box {
      display: flex;
      padding: 10px;
      background-color: #111;
      border-top: 1px solid #222;
    }

    #input-box input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 20px;
      margin-right: 10px;
      background-color: #222;
      color: #fff;
    }

    #input-box button {
      background-color: #007bff;
      border: none;
      border-radius: 20px;
      color: #fff;
      padding: 10px 20px;
      cursor: pointer;
    }

    #input-box button:hover {
      background-color: #005fcc;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">SKY.AI</div>
    <img src="logo.png" alt="Logo" />
  </header>

  <div id="chat-box">
    <div class="msg bot">Halo! Ada yang bisa saya bantu hari ini?</div>
  </div>

  <div id="input-box">
    <input type="text" id="user-input" placeholder="Tulis pesan..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const message = input.value.trim();
      if (!message) return;

      addMessage('user', message);
      input.value = '';

      try {
        const response = await fetch('https://api.openrouter.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer 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',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'openrouter/claude-3-haiku',
            messages: [
              { role: 'system', content: 'Kamu adalah asisten AI yang membantu pelajar Indonesia.' },
              { role: 'user', content: message }
            ]
          })
        });

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'Maaf, terjadi kesalahan.';
        addMessage('bot', reply);
      } catch (e) {
        addMessage('bot', 'Maaf, terjadi kesalahan saat memproses.');
      }
    }

    function addMessage(sender, text) {
      const msg = document.createElement('div');
      msg.className = `msg ${sender}`;
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
