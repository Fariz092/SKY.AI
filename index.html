<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 2rem;
    }
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .flag {
      width: 30px;
      border-radius: 50%;
    }
    .logo {
      width: 150px;
      margin: 2rem auto;
      display: block;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0.5rem 0;
      text-align: center;
    }
    .chatbox {
      width: 100%;
      max-width: 600px;
      background-color: #222;
      padding: 1rem;
      border-radius: 12px;
      min-height: 200px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
      margin-bottom: 1rem;
    }
    .input-container {
      width: 100%;
      max-width: 600px;
      display: flex;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 0.75rem;
      border-radius: 12px 0 0 12px;
      border: none;
      font-size: 1rem;
      background-color: #111;
      color: #fff;
    }
    button {
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 0 12px 12px 0;
      background-color: #444;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h2>SKY.AI</h2>
    <img src="https://flagcdn.com/w320/id.png" alt="ID Flag" class="flag">
  </header>
  <img src="logo.png" alt="SKY.AI Logo" class="logo" />
  <h1>Selamat Datang Di AI Kami</h1>
  <p style="text-align:center; opacity: 0.8;">@Fariz092</p>  <div class="chatbox" id="chat">
    <p>Ada Yang Bisa Saya Bantu?</p>
  </div>  <div class="input-container">
    <input type="text" id="userInput" placeholder="Ketik pertanyaanmu di sini..." />
    <button onclick="kirimPesan()">Kirim</button>
  </div>  <script>
    const API_KEY = "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"; // Masukkan API Key kamu di sini
    const chat = document.getElementById("chat");

    function tampilkanPesan(teks, pengirim = "user") {
      const p = document.createElement("p");
      p.textContent = teks;
      p.style.background = pengirim === "user" ? "#333" : "#1e1e1e";
      p.style.padding = "0.5rem 1rem";
      p.style.borderRadius = "8px";
      p.style.margin = "0.5rem 0";
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }

    async function kirimPesan() {
      const input = document.getElementById("userInput");
      const pesan = input.value.trim();
      if (!pesan) return;

      tampilkanPesan(pesan, "user");
      input.value = "";

      tampilkanPesan("Sedang mengetik...", "bot");

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await res.json();
        chat.lastChild.remove();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (e) {
        chat.lastChild.remove();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }
  </script></body>
</html>
