<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKY.AI - Buatan Anak Keren</title>
  <style>
    @font-face {
      font-family: 'Quantify';
      src: url('Quantify.ttf') format('truetype');
    }

    body {
      margin: 0;
      font-family: 'Quantify', sans-serif;
      background-color: #000000;
      color: white;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 100px;
      animation: zoomIn 1.5s ease;
    }

    @keyframes zoomIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 2.2rem;
      margin-top: 10px;
      animation: slowfade 4s ease;
    }

    @keyframes slowfade {
      0% { opacity: 0; letter-spacing: 5px; }
      100% { opacity: 1; letter-spacing: 1px; }
    }

    .chat-box {
      background-color: #1a1a1a;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 700px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      animation: fadeIn 1.2s ease;
    }

    input[type="text"] {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      border-radius: 10px;
      border: none;
      outline: none;
      background-color: #2b2b2b;
      color: white;
      margin-bottom: 10px;
    }

    button {
      padding: 10px 25px;
      background-color: #00bcd4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    #response {
      margin-top: 20px;
      white-space: pre-line;
    }

    .top-left {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      align-items: center;
    }

    .bendera {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid white;
    }

    .skyai-text {
      font-family: 'Quantify', sans-serif;
      font-size: 1.5rem;
      animation: slowfade 3s ease;
    }
  </style>
</head>
<body>
  <div class="top-left">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9f/Flag_of_Indonesia.svg" class="bendera" alt="IDN">
    <div class="skyai-text">SkyAI</div>
  </div>

  <img src="https://raw.githubusercontent.com/Fariz092/SKY.AI/main/logo.png" alt="SKY Logo" class="logo">
  <h1>Welcome to SKY.AI </h1>

  <div class="chat-box">
    <input type="text" id="userInput" placeholder="Tulis pertanyaanmu di sini...">
    <button onclick="sendMessage()">Kirim</button>
    <div id="response"></div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const responseBox = document.getElementById('response');
      const question = input.value.trim();
      if (!question) return;

      responseBox.textContent = 'Menunggu jawaban...';

      try {
        const res = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer ecVpVvRlg0lowsQNNGIBL5BuPi0kTkjjPe6G3eRs",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "command-r-plus",
            message: question
          })
        });

        const data = await res.json();
        const aiReply = data.text || "Tidak ada jawaban.";
        responseBox.textContent = aiReply;

      } catch (err) {
        responseBox.textContent = "Terjadi kesalahan saat memproses.";
        console.error(err);
      }
    }
  </script>
</body>
  </html>
