<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      background-color: #1e293b;
      width: 100%;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    #chatbox {
      width: 90%;
      max-width: 600px;
      margin-top: 20px;
      background-color: #1e293b;
      border-radius: 10px;
      padding: 20px;
      overflow-y: auto;
      height: 60vh;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .pesan {
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }
    .user {
      background-color: #2563eb;
      align-self: flex-end;
      text-align: right;
    }
    .bot {
      background-color: #334155;
      align-self: flex-start;
    }
    #formInput {
      margin: 20px;
      width: 90%;
      max-width: 600px;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #22c55e;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #16a34a;
    }
    .typing {
      font-style: italic;
      opacity: 0.7;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>SKY.AI - Chatbot Pelajaran</h1>
  </header>  <div id="chatbox"></div>  <div id="formInput">
    <input type="text" id="pesanInput" placeholder="Tanyakan sesuatu..." autofocus />
    <button onclick="kirim()">Kirim</button>
  </div>  <script>
    const API_KEY = "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";

    function tampilkanPesan(teks, pengirim) {
      const box = document.getElementById("chatbox");
      const div = document.createElement("div");
      div.classList.add("pesan", pengirim);
      div.innerHTML = teks;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function tampilkanAnimasiKetik() {
      const box = document.getElementById("chatbox");
      const animasi = document.createElement("div");
      animasi.classList.add("pesan", "bot", "typing");
      animasi.id = "typingAnimasi";
      animasi.innerText = "Sedang mengetik...";
      box.appendChild(animasi);
      box.scrollTop = box.scrollHeight;
    }

    function hapusAnimasiKetik() {
      const animasi = document.getElementById("typingAnimasi");
      if (animasi) animasi.remove();
    }

    async function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value.trim();
      if (!pesan) return;
      tampilkanPesan(pesan, "user");
      input.value = "";
      tampilkanAnimasiKetik();

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "SKY.AI Chatbot"
          },
          body: JSON.stringify({
            model: "openai/gpt-3.5-turbo",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025."
              },
              {
                role: "user",
                content: pesan
              }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }
  </script></body>
</html>
