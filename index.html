<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Ubuntu', sans-serif;
    }
    body {
      background-color: #0f172a;
      color: white;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header img {
      display: block;
      margin: 0 auto 10px;
      width: 120px;
      height: auto;
    }
    header h1 {
      font-size: 2rem;
    }
    #chatbox {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      max-width: 700px;
      margin: 20px auto;
      min-height: 200px;
    }
    #chatlog {
      margin-bottom: 20px;
    }
    .message {
      margin-bottom: 10px;
    }
    .user {
      text-align: right;
      color: #38bdf8;
    }
    .bot {
      text-align: left;
      color: #facc15;
    }
    #inputArea {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      cursor: pointer;
    }
    .typing {
      font-style: italic;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <header>
    <img src="Proyek%20Baru%20251%20%5B77F9643%5D.png" alt="Logo" />
    <h1>SKY.AI - Chatbot Pelajaran</h1>
  </header>
  <section id="chatbox">
    <div id="chatlog"></div>
    <div id="typing" class="typing"></div>
  </section>
  <div id="inputArea">
    <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
    <button onclick="kirim()">Kirim</button>
  </div>  <script>
    async function kirimChat(pesan) {
      tampilkanPesan(pesan, "user");
      tampilkanKetik();
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://github.com/Fariz092",
            "X-Title": "SKY.AI Chatbot"
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              {
                role: "system",
                content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025."
              },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }

    function tampilkanPesan(teks, tipe) {
      const chatlog = document.getElementById("chatlog");
      const div = document.createElement("div");
      div.className = `message ${tipe}`;
      div.textContent = teks;
      chatlog.appendChild(div);
      chatlog.scrollTop = chatlog.scrollHeight;
    }

    function tampilkanKetik() {
      document.getElementById("typing").innerHTML = "Sedang mengetik...";
    }

    function hapusAnimasiKetik() {
      document.getElementById("typing").innerHTML = "";
    }

    function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value.trim();
      if (pesan) {
        kirimChat(pesan);
        input.value = "";
      }
    }
  </script></body>
</html>
