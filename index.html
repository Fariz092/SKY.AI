<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI - Chatbot Pelajaran</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #0f172a;
      color: white;
    }
    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
    }
    h1 {
      font-size: 2rem;
      margin: 0.5rem 0 1rem;
    }
    .chat-container {
      max-width: 800px;
      margin: auto;
      background-color: #1e293b;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    }
    #chatbox {
      min-height: 300px;
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 1rem;
    }
    .message {
      margin: 0.5rem 0;
      padding: 1rem;
      border-radius: 10px;
      line-height: 1.5;
    }
    .user {
      background-color: #334155;
      text-align: right;
    }
    .bot {
      background-color: #475569;
    }
    .typing {
      font-style: italic;
      opacity: 0.6;
    }
    #inputSection {
      display: flex;
      gap: 0.5rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      background-color: #38bdf8;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0ea5e9;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo SKY.AI" class="logo">
    <h1>SKY.AI</h1>
    <p>Teman santai untuk belajar semua mata pelajaran</p>
  </header>
  <div class="chat-container">
    <div id="chatbox"></div>
    <div id="inputSection">
      <input type="text" id="pesanInput" placeholder="Tanyakan sesuatu..." />
      <button onclick="kirim()">Kirim</button>
    </div>
  </div>  <script>
    const chatbox = document.getElementById("chatbox");

    function tampilkanPesan(teks, tipe) {
      const elemen = document.createElement("div");
      elemen.className = `message ${tipe}`;
      elemen.textContent = teks;
      chatbox.appendChild(elemen);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function tampilkanAnimasiKetik() {
      const animasi = document.createElement("div");
      animasi.className = "message bot typing";
      animasi.id = "typing";
      animasi.textContent = "Sedang mengetik...";
      chatbox.appendChild(animasi);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function hapusAnimasiKetik() {
      const animasi = document.getElementById("typing");
      if (animasi) animasi.remove();
    }

    async function kirimChat(pesan) {
      tampilkanPesan(pesan, "user");
      tampilkanAnimasiKetik();
      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer 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",
            "Content-Type": "application/json",
            "HTTP-Referer": "https://fariz092.github.io/SKY.AI/",
            "X-Title": "SKY.AI Chatbot"
          },
          body: JSON.stringify({
            model: "openchat/openchat-7b",
            messages: [
              { role: "system", content: "Kamu adalah chatbot pelajaran Indonesia yang ramah dan santai. Jawablah dengan bahasa santai tapi tetap informatif sesuai kurikulum 2025." },
              { role: "user", content: pesan }
            ]
          })
        });

        const data = await response.json();
        hapusAnimasiKetik();
        if (data.choices && data.choices.length > 0) {
          tampilkanPesan(data.choices[0].message.content, "bot");
        } else {
          tampilkanPesan("Maaf, terjadi kesalahan.", "bot");
        }
      } catch (err) {
        hapusAnimasiKetik();
        tampilkanPesan("Gagal terhubung ke server. Coba lagi nanti.", "bot");
      }
    }

    function kirim() {
      const input = document.getElementById("pesanInput");
      const pesan = input.value.trim();
      if (pesan) {
        kirimChat(pesan);
        input.value = "";
      }
    }
  </script></body>
</html>
