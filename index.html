<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY.AI</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #f1f1f1;
    }
    header {
      background-color: #1a1a1a;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
    }
    #chat {
      max-width: 700px;
      margin: 20px auto;
      padding: 20px;
      background-color: #1e1e1e;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
      overflow-y: auto;
      height: 60vh;
    }
    .message {
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .bot {
      color: #00c853;
    }
    .user {
      text-align: right;
      color: #42a5f5;
    }
    #form {
      max-width: 700px;
      margin: 10px auto;
      display: flex;
      padding: 10px;
    }
    #input {
      flex-grow: 1;
      padding: 10px;
      font-size: 1rem;
      border: none;
      border-radius: 5px 0 0 5px;
    }
    button {
      padding: 10px;
      font-size: 1rem;
      border: none;
      background-color: #00c853;
      color: white;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }
    footer {
      text-align: center;
      color: #777;
      font-size: 0.8rem;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>SKY.AI - Teman Belajar Pintar</header>
  <div id="chat"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Tanyakan sesuatu..." required autocomplete="off" />
    <button type="submit">Kirim</button>
  </form>
  <footer>Dibuat dengan semangat oleh sang pencipta, Fariz</footer>

  <script>
    const apiKey = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S";
    const model = "command-r-plus";

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const userInput = input.value.trim();
      if (!userInput) return;

      appendMessage("Kamu", userInput, "user");
      input.value = "";

      appendMessage("AI", "Mengetik...", "bot", true);

      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: model,
            chat_history: [],
            message: userInput,
            prompt_truncation: "AUTO",
          }),
        });

        const data = await response.json();
        const botReply = data.text || "Maaf, terjadi kesalahan.";

        removeLastMessage();
        appendMessage("AI", botReply, "bot");
      } catch (error) {
        removeLastMessage();
        appendMessage("AI", "Maaf, terjadi kesalahan koneksi.", "bot");
      }
    });

    function appendMessage(sender, text, className, isTemp = false) {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + className;
      messageDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
      if (isTemp) messageDiv.id = "typing";
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
    }

    function removeLastMessage() {
      const typing = document.getElementById("typing");
      if (typing) chat.removeChild(typing);
    }
  </script>
</body>
</html>
