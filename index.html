<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKY AI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #000; /* hitam pekat */
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    header img {
      width: 120px;
      height: auto;
    }
    #chat-container {
      background-color: #111;
      width: 90%;
      max-width: 600px;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: 60vh;
      overflow-y: auto;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      text-align: right;
      color: #4fc3f7;
    }
    .bot {
      text-align: left;
      color: #a5d6a7;
    }
    #input-container {
      margin-top: 20px;
      display: flex;
      width: 90%;
      max-width: 600px;
    }
    #input-container input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px 0 0 5px;
    }
    #input-container button {
      padding: 10px 20px;
      border: none;
      background-color: #333;
      color: white;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SKY AI" />
  </header>
  <div id="chat-container"></div>
  <div id="input-container">
    <input type="text" id="user-input" placeholder="Tulis pertanyaanmu..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;
      appendMessage("Kamu", message, "user");
      input.value = "";

      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Authorization": "Bearer ecVpVvRlg0lowsQNNGIBL5BuPi0kTkjjPe6G3eRs",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "command-r-plus",
            message: message
          })
        });

        const data = await response.json();
        const reply = data.text || "Maaf, terjadi kesalahan.";
        appendMessage("SKY AI", reply, "bot");
      } catch (error) {
        appendMessage("SKY AI", "Maaf, tidak dapat terhubung.", "bot");
      }
    }

    function appendMessage(sender, text, className) {
      const chat = document.getElementById("chat-container");
      const msg = document.createElement("div");
      msg.className = `message ${className}`;
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
