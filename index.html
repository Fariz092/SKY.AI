<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKY.AI</title>
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-color: #111;
    }
    header img {
      height: 40px;
    }
    main {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 8px 0;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background-color: #444;
    }
    .bot {
      align-self: flex-start;
      background-color: #007bff;
    }
    form {
      display: flex;
      padding: 12px;
      background-color: #111;
      border-top: 1px solid #333;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      margin-right: 8px;
      background-color: #222;
      color: white;
    }
    button {
      padding: 10px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="SKY.AI Logo">
  </header>
  <main id="chat"></main>
  <form id="form">
    <input type="text" id="input" placeholder="Ketik pertanyaanmu di sini..." autocomplete="off" required />
    <button type="submit">Kirim</button>
  </form>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chat = document.getElementById('chat');

    const API_KEY = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S"; // <- Ganti di sini

    function addMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.textContent = text;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const userMessage = input.value;
      addMessage(userMessage, 'user');
      input.value = "";

      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: userMessage,
            model: "command-r-plus",
            temperature: 0.6
          })
        });

        const data = await response.json();
        const botReply = data.text || "Maaf, tidak bisa menjawab saat ini.";
        addMessage("SKY.AI: " + botReply, 'bot');
      } catch (err) {
        addMessage("SKY.AI: Maaf, terjadi kesalahan.", 'bot');
      }
    };
  </script>
</body>
</html>
