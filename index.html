<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Pelajar Indonesia</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 p-4 hidden md:block">
      <h2 class="text-xl font-bold mb-4">Mata Pelajaran</h2>
      <ul class="space-y-2">
        <li><button class="w-full text-left hover:text-yellow-400">Matematika</button></li>
        <li><button class="w-full text-left hover:text-yellow-400">IPA</button></li>
        <li><button class="w-full text-left hover:text-yellow-400">Bahasa Indonesia</button></li>
        <li><button class="w-full text-left hover:text-yellow-400">Bahasa Inggris</button></li>
        <li><button class="w-full text-left hover:text-yellow-400">PPKN</button></li>
      </ul>
    </aside><!-- Main Chat Area -->
<main class="flex-1 flex flex-col">
  <!-- Header -->
  <header class="bg-gray-800 p-4 text-xl font-semibold text-center">
    SKY.AI - Chatbot Pelajar
  </header>

  <!-- Chat messages -->
  <div id="chat-box" class="flex-1 p-4 space-y-4 overflow-y-auto">
    <!-- Chat akan ditampilkan di sini -->
  </div>

  <!-- Chat input -->
  <form id="chat-form" class="bg-gray-800 p-4 flex">
    <input id="user-input" type="text" placeholder="Tanyakan apa saja..." class="flex-1 px-4 py-2 rounded-l bg-gray-700 text-white focus:outline-none" />
    <button type="submit" class="bg-yellow-500 px-4 py-2 rounded-r text-black font-bold hover:bg-yellow-400">Kirim</button>
  </form>
</main>

  </div>  <script>
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');

    const COHERE_API_KEY = "HAE2u24oT5w0v7mr6d8tbHmNETZyoMvbONgHav7S"; // Ganti ini dengan API key kamu

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const userText = userInput.value.trim();
      if (!userText) return;

      // Tampilkan pesan user
      chatBox.innerHTML += `<div class='text-right'><div class='inline-block bg-yellow-600 px-4 py-2 rounded-lg mb-2'>${userText}</div></div>`;
      userInput.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Kirim ke Cohere Command R
      try {
        const response = await fetch("https://api.cohere.ai/v1/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${COHERE_API_KEY}`
          },
          body: JSON.stringify({
            model: "command-r-plus",
            message: userText,
            connectors: [{ id: "web-search" }]
          })
        });

        const data = await response.json();
        const botReply = data.text || "Maaf, saya tidak bisa menjawab saat ini.";

        chatBox.innerHTML += `<div class='text-left'><div class='inline-block bg-gray-700 px-4 py-2 rounded-lg mb-2'>${botReply}</div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

      } catch (error) {
        chatBox.innerHTML += `<div class='text-left'><div class='inline-block bg-red-700 px-4 py-2 rounded-lg mb-2'>Terjadi kesalahan. Coba lagi nanti.</div></div>`;
      }
    });
  </script></body>
  </html>
