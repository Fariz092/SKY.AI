<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Pelajaran</title>
  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    #chatbox {
      background: #1e293b;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Chatbot Pelajaran</h1>
  <input type="text" id="pesanInput" placeholder="Tanya sesuatu..." />
  <button onclick="kirim()">Kirim</button>
  <div id="chatbox"></div>

  <script>
    async function kirimChat(pesan) {
      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": "Bearer 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",
          "Content-Type": "application/json",
          "HTTP-Referer": "https://github.com/Fariz092", 
          "X-Title": "Chatbot Pelajaran"
        },
        body: JSON.stringify({
          model: "openai/gpt-3.5-turbo",
          messages: [
            { role: "system", content: "Kamu adalah asisten pelajaran Indonesia." },
            { role: "user", content: pesan }
          ]
        })
      });
      const data = await response.json();
      const jawaban = data.choices[0].message.content;
      tampilkanJawaban(jawaban);
    }

    function tampilkanJawaban(teks) {
      const box = document.getElementById("chatbox");
      box.innerHTML = `<p>${teks}</p>`;
    }

    function kirim() {
      const input = document.getElementById("pesanInput");
      kirimChat(input.value);
    }
  </script>
</body>
</html>
