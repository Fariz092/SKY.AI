<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LyukovAI - Chatbot Santuy</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 15px;
      background-color: #1e1e1e;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #00eaff;
      border-bottom: 1px solid #333;
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
    }

    .user {
      background-color: #00eaff;
      color: #000;
      align-self: flex-end;
    }

    .bot {
      background-color: #2a2a2a;
      color: #fff;
      align-self: flex-start;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: #fff;
    }

    .input-area button {
      padding: 10px 15px;
      margin-left: 10px;
      background-color: #00eaff;
      color: #000;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .typing {
      font-style: italic;
      color: #aaa;
      font-size: 14px;
      margin-left: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>LyukovAI - Chatbot Santuy</header>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Tanya apa aja, bro..." />
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script>
    const API_KEY = 'ecVpVvRlg0lowsQNNGIBL5BuPi0kTkjjPe6G3eRs'; // Ganti dengan API Key dari Cohere
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'user' : 'bot'}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping() {
      const typing = document.createElement('div');
      typing.className = 'message bot typing';
      typing.id = 'typing';
      typing.textContent = 'Lagi mikir nih...';
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, true);
      userInput.value = '';
      showTyping();

      try {
        const res = await fetch('https://api.cohere.ai/v1/generate', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'command',
            prompt: `${text}\n\nLu jawab pake bahasa anak muda ya, santai, gaul, dan enak diajak ngobrol. Jangan kaku. Lu chatbot santuy buatan ${"NAMA KAMU"}, ngerti?`,
            max_tokens: 200,
            temperature: 0.8
          })
        });

        const data = await res.json();
        removeTyping();

        if (data.generations && data.generations.length > 0) {
          addMessage(data.generations[0].text.trim(), false);
        } else {
          addMessage('Waduh, AI-nya lagi bengong nih...', false);
        }
      } catch (error) {
        removeTyping();
        addMessage('Yah, koneksinya error atau API Key-nya zonk!', false);
        console.error(error);
      }
    }
  </script>
</body>
</html>
